name: WARD ROUNDS - Stock the Library

# Runs four times a day and only drafts questions. It never publishes. This is what
# keeps the daily video job supplied, so the channel can run without intervention.

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Questions to draft this run'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: wardrounds
  cancel-in-progress: false

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Credentials
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-5.4-nano' }}
        run: |
          : > .env
          printf '%s\n' "POLLINATIONS_API_KEY=$POLLINATIONS_API_KEY" >> .env
          printf '%s\n' "AI_MODEL=${AI_MODEL:-openai/gpt-5.4-nano}" >> .env

      - name: Library state
        run: python build.py --list

      - name: Draft
        run: python build.py --bootstrap "${{ github.event.inputs.count || '5' }}"

      - name: Commit
        if: always()
        run: |
          git config user.name "wardrounds-bot"
          git config user.email "wardrounds-bot@users.noreply.github.com"
          git add -A data output
          git commit -m "stock: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
            git push && break || sleep 5
          done
