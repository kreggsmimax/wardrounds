name: QBANK - Daily Question Set

on:
  schedule:
    - cron: '40 15 * * *'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build only (skip YouTube)'
        required: false
        default: false
        type: boolean
      questions:
        description: 'Questions per video'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: daily-vignette
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          sudo fc-cache -f

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Credentials
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          : > .env
          printf '%s\n' "YT_CLIENT_ID=$YT_CLIENT_ID" >> .env
          printf '%s\n' "YT_CLIENT_SECRET=$YT_CLIENT_SECRET" >> .env
          printf '%s\n' "YT_REFRESH_TOKEN=$YT_REFRESH_TOKEN" >> .env

      # The gate: refuses to render if any approved fact did not survive into the
      # narration. A failure here is the pipeline doing its job, not a bug.
      - name: Verify ledger
        run: python build.py --list

      - name: Build
        run: python build.py --questions "${{ github.event.inputs.questions || '2' }}" --shorts

      - name: Check duration and metadata
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("output/latest_video.json", encoding="utf-8"))
          secs = float(m["duration_seconds"])
          print(f"duration: {secs/60:.2f} min")
          print(f"title   : {m['title']}")
          print(f"cues    : {m['caption_cues']}")
          if secs > 900:
              sys.exit("video exceeds 15 minutes")
          if not m["title"] or not m["description"]:
              sys.exit("metadata incomplete")
          PY

      - name: Upload
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        run: python upload_to_youtube.py

      - name: Save history
        if: always()
        run: |
          mkdir -p output
          cp output/latest_video.json "output/history/$(date -u +%Y-%m-%d).json" || true
          git config user.name "vignette-bot"
          git config user.email "vignette-bot@users.noreply.github.com"
          git add -A output
          git commit -m "video: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push || echo "push skipped"

      - name: Cleanup heavy files
        if: always()
        run: |
          rm -rf output/videos/work output/videos/*.mp4 || true
