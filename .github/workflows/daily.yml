name: WARD ROUNDS - Daily Question Set

on:
  schedule:
    - cron: '30 3 * * *'   # 03:30 UTC = 09:00 IST
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Build only (skip YouTube)'
        required: false
        default: false
        type: boolean
      privacy:
        description: 'public or private'
        required: false
        default: 'public'
      questions:
        description: 'Questions per video'
        required: false
        default: '3'
      generate:
        description: 'New questions to draft with Pollinations'
        required: false
        default: '3'
      bootstrap:
        description: 'Draft N questions only, no video (0 = off)'
        required: false
        default: '0'

permissions:
  contents: write

concurrency:
  group: daily-wardrounds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core
          sudo fc-cache -f

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Credentials
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-5.4-nano' }}
          PRIVACY: ${{ github.event.inputs.privacy || 'public' }}
        run: |
          : > .env
          printf '%s\n' "POLLINATIONS_API_KEY=$POLLINATIONS_API_KEY" >> .env
          printf '%s\n' "YT_CLIENT_ID=$YT_CLIENT_ID" >> .env
          printf '%s\n' "YT_CLIENT_SECRET=$YT_CLIENT_SECRET" >> .env
          printf '%s\n' "YT_REFRESH_TOKEN=$YT_REFRESH_TOKEN" >> .env
          printf '%s\n' "AI_MODEL=${AI_MODEL:-openai/gpt-5.4-nano}" >> .env
          printf '%s\n' "PRIVACY=${PRIVACY:-public}" >> .env

      - name: Ledger state
        run: python build.py --list

      - name: Bootstrap ledger
        if: ${{ github.event.inputs.bootstrap != '' && github.event.inputs.bootstrap != '0' }}
        run: python build.py --bootstrap "${{ github.event.inputs.bootstrap }}"

      # Generates fresh questions, drafts are fact-checked by a second model, then the
      # video is built from the approved pool. Refuses to publish duplicates inside the
      # 21-day cooldown.
      - name: Build
        if: ${{ github.event.inputs.bootstrap == '' || github.event.inputs.bootstrap == '0' }}
        run: |
          python build.py \
            --questions "${{ github.event.inputs.questions || '3' }}" \
            --generate "${{ github.event.inputs.generate || '3' }}" \
            --shorts

      - name: Check output
        if: ${{ github.event.inputs.bootstrap == '' || github.event.inputs.bootstrap == '0' }}
        run: |
          python - <<'PY'
          import json, sys
          m = json.load(open("output/latest_video.json", encoding="utf-8"))
          secs = float(m["duration_seconds"])
          print(f"duration : {secs/60:.2f} min")
          print(f"title    : {m['title']}")
          print(f"questions: {len(m['questions'])}")
          print(f"cues     : {m['caption_cues']}")
          if secs > 900:
              sys.exit("video exceeds 15 minutes")
          if len(m["questions"]) < 2:
              sys.exit("fewer than 2 questions in the video")
          PY

      - name: Upload
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        run: python upload_to_youtube.py

      - name: Save ledger and history
        if: always()
        run: |
          mkdir -p output/history
          cp output/latest_video.json "output/history/$(date -u +%Y-%m-%d).json" || true
          git config user.name "wardrounds-bot"
          git config user.email "wardrounds-bot@users.noreply.github.com"
          git add -A data output
          git commit -m "video: $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)" || true
          git push || echo "push skipped"

      - name: Cleanup heavy files
        if: always()
        run: |
          rm -rf output/videos/work output/videos/*.mp4 build || true
